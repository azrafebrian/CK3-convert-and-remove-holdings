l_english:
 halfsade_change_holding_decision:0 "Convert a Holding"
 halfsade_change_holding_decision_desc:0 "Convert a holding in controlled counties into a castle, city, temple, or other types, or erase a holding completely from the map."
 halfsade_change_holding_decision_tooltip:0 "Change the type of a holding within your controlled county or remove it from the map."
 halfsade_change_holding_decision_confirm:0 "Select Holding"
 halfsade_change_holding_buildings_effect:0 "All buildings and upgrades in the holding will be lost."
 halfsade_change_holding_conversion_effect:0 "Holding will be converted as a different type, or removed entirely."
 halfsade_change_holding_cancel_cooldown:0 "You changed your mind. Gathering thoughts for a few days."
 NOT_halfsade_change_holding_cancel_cooldown:0 "You changed your mind. Gathering thoughts for a few days."
 not_halfsade_change_holding_cancel_cooldown_first:0 "You changed your mind. Gathering thoughts for a few days."
 halfsade_holding_selected:0 "A holding is selected"
 halfsade_holdings.0001.t:0 "Reshaping the Land"
 halfsade_holdings.0001.desc:0 "What shall this land become?"
 halfsade_holdings.0001.desc.castle:0 "The barony of [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], stands as it always has. What shall this land become?"
 halfsade_holdings.0001.desc.city:0 "The streets of [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], are crowded with merchants and craftsmen. What shall this land become?"
 halfsade_holdings.0001.desc.temple:0 "The temple of [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], has long served the faithful. What shall this land become?"
 halfsade_holdings.0001.desc.tribal:0 "The tribal lands of [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], have been held by clan and kin. What shall this land become?"
 halfsade_holdings.0001.desc.nomad:0 "The nomadic camp at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], has been home to wandering peoples. What shall this land become?"
 halfsade_holdings.0001.desc.herder:0 "The herder settlement at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], has fed itself from its flocks. What shall this land become?"
 halfsade_holdings.0001.desc.temple_citadel:0 "The temple citadel of [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], is both shrine and fortress. What shall this land become?"
 halfsade_holdings.0001.castle:0 "Construct a Castle"
 halfsade_holdings.0001.city:0 "Establish a City"
 halfsade_holdings.0001.temple:0 "Consecrate a Temple"
 halfsade_holdings.0001.tribal:0 "Settle a Tribe"
 halfsade_holdings.0001.nomad:0 "Establish a Nomadic Settlement"
 halfsade_holdings.0001.herder:0 "Settle a Herd"
 halfsade_holdings.0001.temple_citadel:0 "Raise a Temple Citadel"
 halfsade_holdings.0001.remove:0 "Erase the Holding"
 halfsade_holdings.0001.cancel:0 "Leave Unchanged"
 halfsade_holdings.0002.t:0 "Enact the Decree"
 halfsade_holdings.0002.desc.castle:0 "A castle will be constructed at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.city:0 "A city will be established at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.temple:0 "A temple will be consecrated at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.tribal:0 "A tribe will be settled at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.nomad:0 "A nomadic settlement will be established at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.herder:0 "A herder settlement will be settled at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.temple_citadel:0 "A temple citadel will be raised at [SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier]. Every building will be torn down, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will resent the upheaval for years. The decree cannot be recalled, but this foundation must be laid."
 halfsade_holdings.0002.desc.remove:0 "[SCOPE.sTitle('halfsade_target_barony').GetNameNoTier], in [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier], will be erased from the map and its lands left bare. Whatever stands there will be lost, and the people of [SCOPE.sTitle('halfsade_target_barony').GetDeJureLiege.GetNameNoTier] will long remember it. The decree cannot be recalled, but this foundation must be laid.\n\nAny lease contract will be ended, and a deposed, landless vassal will join your court."
 halfsade_holdings.0002.desc.poor:0 "\n\nInsufficient wealth to command this change!"
 halfsade_holdings.0002.confirm:0 "Reshape the Land"
 halfsade_holdings.0002.back:0 "Consider Other Options"
 halfsade_holding_upheaval_modifier:0 "Upheaval"
 halfsade_holding_upheaval_modifier_desc:0 "The holding is still recovering from being torn down and rebuilt."
 halfsade_county_unrest_modifier:0 "Restless Townsfolk"
 halfsade_county_unrest_modifier_desc:0 "The people of this county resent the upheaval forced upon one of their holdings."